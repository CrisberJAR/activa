<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}ACTIVA{% endblock %} · Grupo Activa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='css/estilos.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
  {% if usuario %}
  <nav class="navbar navbar-expand navbar-dark bg-activa">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ '/gerente' if usuario.rol == 'gerente' else '/asesor' }}"><i class="bi bi-bar-chart-line"></i> ACTIVA</a>
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/bloques">Bloques</a></li>
        <li class="nav-item"><a class="nav-link" href="/encuestas">Encuestas</a></li>
        <li class="nav-item"><a class="nav-link" href="/clima">Clima</a></li>
        <li class="nav-item"><a class="nav-link" href="/analisis">Análisis</a></li>
        <li class="nav-item"><a class="nav-link" href="/campanas">Campañas</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3 text-white">
        <span>{{ usuario.nombre }}
          <span class="badge bg-light text-dark text-capitalize">{{ usuario.rol }}</span></span>
        <a class="btn btn-sm btn-outline-light" href="/logout"><i class="bi bi-box-arrow-right"></i> Salir</a>
      </div>
    </div>
  </nav>
  {% endif %}
  <main class="container py-4">
    {% if aviso %}
    <div class="alert alert-success alert-dismissible fade show">
      {{ aviso }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    {% endif %}
    {% block contenido %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
