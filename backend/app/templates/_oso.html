{# Uku, el Oso de Anteojos (mascota). Dibujo propio en SVG; las clases .oso-ojo y .oso-pata se animan con CSS. #}
<svg class="oso {{ clase|default('') }}" viewBox="0 0 120 120" role="img" aria-label="Uku, el Oso de Anteojos">
  <!-- orejas -->
  <circle cx="28" cy="30" r="15" fill="#2b1d14"/>
  <circle cx="92" cy="30" r="15" fill="#2b1d14"/>
  <circle cx="28" cy="30" r="7" fill="#6b4a36"/>
  <circle cx="92" cy="30" r="7" fill="#6b4a36"/>
  <!-- cabeza -->
  <ellipse cx="60" cy="62" rx="42" ry="39" fill="#2b1d14"/>
  <!-- manchas claras alrededor de los ojos ("anteojos") y hocico -->
  <path d="M30 58c0-9 7-15 15-15 6 0 10 3 15 6 5-3 9-6 15-6 8 0 15 6 15 15 0 7-5 12-11 13l-6 9H47l-6-9c-6-1-11-6-11-13z" fill="#f2d7a6"/>
  <ellipse cx="60" cy="82" rx="20" ry="15" fill="#f2d7a6"/>
  <!-- ojos (parpadean) -->
  <g class="oso-ojo">
    <ellipse cx="45" cy="57" rx="5.5" ry="6.5" fill="#1a120c"/>
    <circle cx="47" cy="54.5" r="2" fill="#fff"/>
  </g>
  <g class="oso-ojo">
    <ellipse cx="75" cy="57" rx="5.5" ry="6.5" fill="#1a120c"/>
    <circle cx="77" cy="54.5" r="2" fill="#fff"/>
  </g>
  <!-- mejillas, nariz y sonrisa -->
  <circle cx="32" cy="74" r="5" fill="#f28b82" opacity=".45"/>
  <circle cx="88" cy="74" r="5" fill="#f28b82" opacity=".45"/>
  <ellipse cx="60" cy="74" rx="7.5" ry="5.5" fill="#1a120c"/>
  <ellipse cx="58" cy="72.5" rx="2.2" ry="1.3" fill="#fff" opacity=".6"/>
  <path d="M51 83q9 8 18 0" stroke="#1a120c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- pañuelo verde de la empresa -->
  <path d="M34 96q26 14 52 0l-4 10q-22 9-44 0z" fill="#12a06a"/>
  <!-- pata que saluda -->
  <g class="oso-pata">
    <ellipse cx="103" cy="92" rx="10" ry="13" fill="#2b1d14"/>
    <ellipse cx="103" cy="89" rx="5" ry="5.5" fill="#f2d7a6"/>
  </g>
</svg>
