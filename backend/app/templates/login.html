{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-1"><i class="bi bi-bar-chart-line text-activa"></i> ACTIVA <span class="text-warning">360°</span></h1>
        <p class="text-center text-muted small mb-4">Plataforma inteligente de inclusión y gestión financiera</p>
        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label" for="email">Correo</label>
            <input class="form-control" type="email" id="email" name="email" value="{{ email }}" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" type="password" id="password" name="password" required>
          </div>
          <button class="btn btn-activa w-100" type="submit">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
