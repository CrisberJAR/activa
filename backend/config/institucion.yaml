nombre: Grupo Activa
razon_social: GRUPO ACTIVA S.A.C.
ciudad: Huánuco
eslogan: Impulsamos a quienes mueven Huánuco
subtitulo: >-
  Créditos pensados para agricultores, comerciantes, emprendedores y transportistas,
  con campañas que llegan justo cuando tu negocio más lo necesita.

quienes_somos: >-
  Somos una institución de microfinanzas de Huánuco que conoce de cerca el trabajo de la chacra,
  del mercado y de la calle. Acompañamos a cada cliente con asesores que lo visitan, lo escuchan
  y le ofrecen un crédito a la medida de su realidad.
proposito: >-
  Apoyar firmemente a los microempresarios, agricultores, comerciantes y emprendedores de la región
  para que sus negocios crezcan y estén preparados para cada temporada del año.

